name: RunBhoomi Flutter CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build & Analyze APK
    runs-on: ubuntu-latest

    steps:
      # ✅ Checkout
      - name: Checkout Repo
        uses: actions/checkout@v4

      # ✅ Setup Java (required for Android)
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # ✅ Setup Flutter (FIXED VERSION → avoids your win32 error)
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.22.0"
          cache: true

      # ✅ Cache Pub dependencies (FASTER builds)
      - name: Cache Pub
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      # ✅ Disable analytics (clean logs)
      - name: Disable Flutter Analytics
        run: flutter config --no-analytics

      # ✅ Doctor (debug step)
      - name: Flutter Doctor
        run: flutter doctor -v

      # ✅ Install dependencies
      - name: Get Dependencies
        run: flutter pub get

      # ✅ Analyze (safe, no fail on info)
      - name: Analyze Code
        run: flutter analyze --no-fatal-infos

      # ✅ Run tests (optional)
      - name: Run Tests
        run: |
          if [ -d "test" ]; then
            flutter test
          else
            echo "No tests found"
          fi

      # ✅ Build APK (split → smaller size)
      - name: Build Debug APK
        run: flutter build apk --debug --split-per-abi

      # ✅ Upload artifacts (ALL APKs)
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: runbhoomi-apks
          path: build/app/outputs/flutter-apk/*.apk

